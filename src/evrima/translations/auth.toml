# Texts of the admin login, the account page and the management of
# administrators, including the e-mails. Czech texts use a no-break space
# ( ) after one-letter prepositions and conjunctions.

# --- Login ---------------------------------------------------------------------

[auth.login.title]
en = "Log in"
cs = "Přihlášení"

[auth.login.intro]
en = "Administration of {site}."
cs = "Administrace webu {site}."

[auth.login.email]
en = "E-mail"
cs = "E-mail"

[auth.login.password]
en = "Password"
cs = "Heslo"

[auth.login.submit]
en = "Continue"
cs = "Pokračovat"

[auth.login.forgot]
en = "Forgotten password"
cs = "Zapomenuté heslo"

[auth.login.failed]
en = "Wrong e-mail or password."
cs = "Nesprávný e-mail nebo heslo."

[auth.login.locked]
en = "Too many failed attempts. Try again in {minutes} minutes."
cs = "Příliš mnoho neúspěšných pokusů. Zkuste to znovu za {minutes} min."

[auth.login.mail_failed]
en = "The verification code could not be sent. Try again in a while."
cs = "Ověřovací kód se nepodařilo odeslat. Zkuste to prosím za chvíli."

[auth.login.mail_failed_totp]
en = "The verification code could not be sent. Use the code from your authenticator app."
cs = "Ověřovací kód se nepodařilo odeslat. Použijte kód z ověřovací aplikace."

[auth.login.too_many_codes]
en = "Too many codes were requested in the last hour. Try again later."
cs = "Za poslední hodinu bylo vyžádáno příliš mnoho kódů. Zkuste to prosím později."

[auth.login.expired]
en = "The login took too long. Please start again."
cs = "Přihlášení trvalo příliš dlouho. Začněte prosím znovu."

[auth.logout.done]
en = "You have been logged out."
cs = "Byli jste odhlášeni."

[auth.logout.button]
en = "Log out"
cs = "Odhlásit se"

# --- Verification (PIN or TOTP) --------------------------------------------------

[auth.verify.title]
en = "Verification"
cs = "Ověření"

[auth.verify.pin_intro]
en = "We have sent a six-digit code to {email}. It is valid for 10 minutes."
cs = "Na {email} jsme poslali šestimístný kód. Platí 10 minut."

[auth.verify.pin]
en = "Code from the e-mail"
cs = "Kód z e-mailu"

[auth.verify.totp_intro]
en = "Enter the current code from your authenticator app."
cs = "Zadejte aktuální kód z ověřovací aplikace."

[auth.verify.totp]
en = "Code from the app"
cs = "Kód z aplikace"

[auth.verify.submit]
en = "Log in"
cs = "Přihlásit se"

[auth.verify.use_totp]
en = "Use the code from the authenticator app instead"
cs = "Použít místo toho kód z ověřovací aplikace"

[auth.verify.use_pin]
en = "Use the code from the e-mail instead"
cs = "Použít místo toho kód z e-mailu"

[auth.verify.resend]
en = "Send a new code"
cs = "Poslat nový kód"

[auth.verify.resent]
en = "A new code is on its way."
cs = "Nový kód je na cestě."

[auth.verify.wrong]
en = "The code is not valid."
cs = "Kód není platný."

[auth.verify.too_many]
en = "Too many wrong codes. Send yourself a new one."
cs = "Příliš mnoho chybných kódů. Nechte si poslat nový."

[auth.verify.back]
en = "Log in as someone else"
cs = "Přihlásit se jako někdo jiný"

# --- Password: forgotten, set, rules ------------------------------------------

[auth.forgot.title]
en = "Forgotten password"
cs = "Zapomenuté heslo"

[auth.forgot.intro]
en = "Enter your e-mail. If it belongs to an administrator, we will send a link to set a new password."
cs = "Zadejte svůj e-mail. Pokud patří administrátorovi, pošleme na něj odkaz pro nastavení nového hesla."

[auth.forgot.submit]
en = "Send the link"
cs = "Poslat odkaz"

[auth.forgot.sent]
en = "If the e-mail belongs to an administrator, a link is on its way. It is valid for 1 hour."
cs = "Pokud e-mail patří administrátorovi, odkaz je na cestě. Platí 1 hodinu."

[auth.set_password.title]
en = "New password"
cs = "Nové heslo"

[auth.set_password.title_invite]
en = "Welcome to the administration"
cs = "Vítejte v administraci"

[auth.set_password.intro]
en = "Choose a password for {email}. At least 12 characters; a few words in a row work well."
cs = "Zvolte heslo pro {email}. Aspoň 12 znaků, dobře poslouží několik slov za sebou."

[auth.set_password.password]
en = "New password"
cs = "Nové heslo"

[auth.set_password.confirm]
en = "New password again"
cs = "Nové heslo znovu"

[auth.set_password.submit]
en = "Save the password"
cs = "Uložit heslo"

[auth.set_password.invalid_link]
en = "This link is not valid any more. Ask for a new one."
cs = "Tento odkaz už neplatí. Požádejte o nový."

[auth.set_password.done]
en = "The password is saved. You can log in now."
cs = "Heslo je uložené. Teď se můžete přihlásit."

[auth.password.too_short]
en = "The password must have at least 12 characters."
cs = "Heslo musí mít aspoň 12 znaků."

[auth.password.too_long]
en = "The password is too long."
cs = "Heslo je příliš dlouhé."

[auth.password.mismatch]
en = "The two passwords are not the same."
cs = "Hesla se neshodují."

[auth.password.wrong_current]
en = "The current password is not correct."
cs = "Současné heslo není správné."

