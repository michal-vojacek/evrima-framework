# --- E-mails (plain text) ------------------------------------------------------

[auth.email.signature]
en = "Administration of {site}"
cs = "Administrace webu {site}"

[auth.email.pin.subject]
en = "Login code for {site}"
cs = "Přihlašovací kód pro {site}"

[auth.email.pin.body]
en = """Your login code: {pin}

It is valid for 10 minutes and can be used once.

If you are not logging in right now, someone knows your password. Change it here:
{reset_url}"""
cs = """Váš přihlašovací kód: {pin}

Platí 10 minut a lze ho použít jen jednou.

Pokud se právě nepřihlašujete, někdo zná vaše heslo. Změňte si ho tady:
{reset_url}"""

[auth.email.reset.subject]
en = "New password for {site}"
cs = "Nové heslo pro {site}"

[auth.email.reset.body]
en = """Here is the link to set a new password:
{url}

It is valid for 1 hour and can be used once. If you did not ask for it, you can ignore this e-mail."""
cs = """Tady je odkaz pro nastavení nového hesla:
{url}

Platí 1 hodinu a lze ho použít jen jednou. Pokud jste o něj nežádali, e-mail můžete ignorovat."""

[auth.email.invite.subject]
en = "Invitation to the administration of {site}"
cs = "Pozvánka do administrace webu {site}"

[auth.email.invite.body]
en = """{inviter} has invited you to the administration of {site}.

Choose your password here:
{url}

The link is valid for 3 days."""
cs = """{inviter} vás pozval do administrace webu {site}.

Heslo si zvolíte tady:
{url}

Odkaz platí 3 dny."""

[auth.email.totp_login.subject]
en = "Login to {site} with the authenticator app"
cs = "Přihlášení k {site} přes ověřovací aplikaci"

[auth.email.totp_login.body]
en = """Someone has just logged in to the administration of {site} with a code from the authenticator app.
Browser: {browser}

If it was not you, change your password straight away:
{reset_url}"""
cs = """Právě se někdo přihlásil do administrace webu {site} kódem z ověřovací aplikace.
Prohlížeč: {browser}

Pokud jste to nebyli vy, hned si změňte heslo:
{reset_url}"""
