en = "A safety net for when the e-mail with the code does not arrive: instead of it, you can enter the code from an app such as Google Authenticator or Microsoft Authenticator."
cs = "Pojistka pro případ, že e-mail s kódem nedorazí: místo něj zadáte kód z aplikace, například Google Authenticator nebo Microsoft Authenticator."

