[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "evrima"
dynamic = ["version"]
description = "Lightweight, security-first Flask framework and CMS for simple websites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michal Vojáček" }]
requires-python = ">=3.13"
# Every dependency is pinned to an exact version, transitive ones included, so
# two deploys of the same Evrima version install exactly the same code
# (docs/framework.md, "Distribution and deployment"). Regenerate with
# `pip freeze` after an upgrade and review the diff.
dependencies = [
    # Direct dependencies
    "Flask==3.1.3",
    "Flask-WTF==1.3.0",
    "Flask-Limiter[redis]==4.1.1",
    "SQLAlchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "redis==7.4.1",
    "python-dotenv==1.2.4",
    "gunicorn==26.2.0",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "pillow==12.3.0",
    "nh3==0.3.7",
    # Transitive dependencies
    "argon2-cffi-bindings==26.1.0",
    "blinker==1.9.0",
    "cffi==2.1.1",
    "colorama==0.4.6; sys_platform == 'win32'",
    "click==8.5.0",
    "Deprecated==3.0.0",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "limits==5.8.0",
    "Mako==1.4.3",
    "MarkupSafe==3.0.4",
    "ordered-set==4.1.0",
    "packaging==26.3",
    "psycopg-binary==3.3.6",
    "pycparser==3.11",
    "typing_extensions==4.16.0",
    "tzdata==2026.5; sys_platform == 'win32'",
    "Werkzeug==3.1.9",
    "wrapt==2.5.1",
    "WTForms==3.2.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "fakeredis==2.40.0",
    "iniconfig==2.3.1",
    "pluggy==1.6.0",
    "Pygments==2.21.0",
    "sortedcontainers==2.4.0",
]

[tool.hatch.version]
# The package version is derived from the Git tag (v1.2.3 -> 1.2.3).
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/evrima"]

[tool.hatch.build.targets.sdist]
# Source distributions carry only the package and its legal and release notes.
include = ["src/evrima", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The minimal example and the test fixture site are imported as top-level
# packages, the way a real website would be.
pythonpath = ["tests", "examples/minimal"]
